Data:
  train_data: /Users/brianwang76/SPHEREx/pwang55/prospector_emulator/random_samples/train/train_x_coef_mfrac_100k.h5
  valid_split: 0.1                 # this will be ignored if valid_data is not empty
  valid_split_seed: 42
  valid_data: /Users/brianwang76/SPHEREx/pwang55/prospector_emulator/random_samples/valid/valid_x_coef_mfrac_flux_10k.h5
  test_data: /Users/brianwang76/SPHEREx/pwang55/prospector_emulator/random_samples/test/test_x_coef_mfrac_flux_10k.h5
  pca_file: /Users/brianwang76/SPHEREx/pwang55/prospector_emulator/random_samples/pca/log10_flux_pca_modes_100k.npz

Device: auto

Scaler:
  coef_scaling: none                    # none, standard, coef0
  mfrac_scaling: standard               # none, standard, match_coef0

DataLoader:
  train_batch_size: 500
  valid_batch_size: 500
  train_num_workers: 4
  # train_persistent_workers: 2
  train_shuffle: True
  valid_shuffle: True

  test_batch_size: 2000
  test_num_workers: 2
  # test_persistent_workers: 2
  test_shuffle: True

Emulator:
  shared_dims: [512, 512, 512, 512]
  coef_head_dims: 
  mfrac_head_dims: 
  activation: gelu                      # gelu, relu, silu, elu, tanh, leaky_relu
  dropout: 0.0
  predict_mfrac: True

Loss:
  coef_loss: mae                        # mse, rmse, mae, logflux_mse, logflux_mae, flux_mse, flux_mae, relative_flux_mse, relative_flux_mae
  mfrac_loss: mse                       # mse, rmse, mae
  mfrac_lambda: 0.005
  relative_flux_eps: 1.0E-8
  rmse_eps: 1.0E-12
  max_log10_flux:
  wavelength_weights:

Optimizer:
  name: adam                            # adam, adamw, sgd, rmsprop
  learning_rate: 1.0E-3
  weight_decay: 0.0

Scheduler:
  name: reduce_on_plateau
  factor: 0.5
  scheduler_patience: 20
  threshold: 1.0E-4
  threshold_mode: rel
  min_lr: 1.0E-6

Training:
  # device: auto
  max_epochs: 1000
  patience: 50
  abs_min_delta: 0.0
  rel_min_delta: 0.001
  monitor: total                        # total, coef, mfrac
  verbose: True

Outputs:
  outputs_dir: /Users/brianwang76/SPHEREx/pwang55/prospector_emulator/emulator_outputs/pca_emulators
  save_plots: True
  # plot_dir: 
  save_emulator: True
  # emulator_dir: 
  emulator_filename: emulator.pt
