# Configure file for prospector_mcmc.py
Files:
  # catalog: /Users/brianwang76/SPHEREx/testing/highz_clouds/cosmos/collate/l4_collated_006836.parq
  # SPHERExRefID: 1645209205348499459
  filters: 
  template: 

emulator: /Users/brianwang76/SPHEREx/pwang55/prospector_emulator/emulator_outputs/z0001_emulators/z0001_emulator.pt

MCMC:
  nwalkers: 32
  jitter: 1.0E-4
  nsteps: 20000
  discard: 3000
  thin: 20
  zprior: True
  parallel: False
  n_processes: 4
  verbose: True

Outputs:
  output_dir: mcmc_outputs/template_mcmc/
  save_sampler: True
  sampler_filename: use_file    # specific text filename, or 'use_file' to save as pros_mcmc_{SPHERExRefID}.h5
  output_filename: use_file     # filename without extension, for both report (.yaml) and mcmc results (.npz) 
  save_plots: True
  plots_dir: mcmc_outputs/template_mcmc/


# ============================================
# Priors
#
# Available distributions:
# uniform
# loguniform
# loguniform1p
# student_t (df, loc, scale)
# truncnorm (loc, scale)

# noted!! bounds will be override by trained emulator bounds if trained bounds are smaller
# not all parameters defined here will be used; only ones that appear in emulator will
# ============================================
prior_dicts:
  # will be override by a gaussian zprior if it is set to true
  zred:
    fixed: 0.001
    init: 0.3
    bounds: [0.0, 3.0]
    prior:
      dist: uniform

  logmass:
    fixed:
    init: 11.0
    bounds: [7.5, 13.5]
    prior:
      dist: uniform

  logzsol:
    fixed:
    init: 0.0
    bounds: [-2.0, 0.2]
    prior:
      dist: uniform

  logsfr_ratios:
    fixed:
    init: 0.0
    bounds: [-5.0, 5.0]
    prior:
      dist: student_t
      df: 2
      loc: 0.0
      scale: 0.3

  dust2:
    fixed:
    init: 0.3
    bounds: [0.0, 4.0]
    prior:
      dist: truncnorm
      loc: 0.3
      scale: 1.0

  dust_index:
    fixed:
    init: -1.0
    bounds: [-1.2, 0.4]
    prior:
      dist: uniform

  duste_qpah:
    fixed:
    init: 2.0
    bounds: [0.0, 7.0]
    prior:
      dist: truncnorm
      loc: 2.0
      scale: 2.0

# other parameters to be added


